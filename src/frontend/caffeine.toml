manifest_version = "0.1.0"

[project]
name = "frontend"
type = "assets"

[build]
commands = ["bash ../../scripts/ensure-pnpm.sh", "pnpm build"]
out = "dist"

[check]
commands = ["bash ../../scripts/ensure-pnpm.sh", "pnpm typecheck", "pnpm check"]

[check.fix]
commands = ["bash ../../scripts/ensure-pnpm.sh", "pnpm typecheck", "pnpm fix"]
