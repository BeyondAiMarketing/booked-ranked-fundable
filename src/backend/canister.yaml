# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/heads/main/docs/schemas/canister-yaml-schema.json
name: backend
build:
  steps:
    - type: script
      commands:
        # Build the backend canister from source via mops so the deployed wasm
        # always reflects current Motoko source. mops build resolves dependencies
        # (mo:core, caffeineai-*) and produces dist/backend.wasm + dist/backend.did.
        # This makes the canister.yaml self-sufficient — a bare `icp deploy backend`
        # rebuilds from source instead of shipping stale artifacts.
        # mops.toml lives at the project root, so run mops from there.
        - cd ../.. && mops build
        # mops build writes src/backend/dist/backend.wasm (per mops.toml
        # outputDir, which is relative to the project root). Move it into the
        # icp-cli expected output path.
        - mv src/backend/dist/backend.wasm "$ICP_WASM_OUTPUT_PATH"
