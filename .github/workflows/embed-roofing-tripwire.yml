name: Embed roofing tripwire route

on:
  push:
    paths:
      - .github/workflows/embed-roofing-tripwire.yml

permissions:
  contents: write

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add in-app tripwire route
        run: |
          mkdir -p src/frontend/src/assets
          cp src/frontend/public/roofing-ai-growth-playbook/index.html src/frontend/src/assets/roofing-ai-growth-playbook.html
          cat > src/frontend/src/pages/RoofingPlaybookTripwirePage.tsx <<'EOF'
          import tripwireHtml from "../assets/roofing-ai-growth-playbook.html?raw";

          export default function RoofingPlaybookTripwirePage() {
            return (
              <iframe
                title="Free Roofing AI Growth Playbook"
                srcDoc={tripwireHtml}
                style={{ width: "100%", height: "100vh", border: 0, display: "block" }}
              />
            );
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/frontend/src/App.tsx')
          text = path.read_text()

          import_anchor = 'import RoofingPage from "./pages/RoofingPage";'
          import_line = 'import RoofingPlaybookTripwirePage from "./pages/RoofingPlaybookTripwirePage";'
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + '\n' + import_line, 1)

          route_anchor = 'const roofingRoute = simple("/roofing", RoofingPage);'
          route_line = 'const roofingPlaybookTripwireRoute = simple("/roofing-ai-growth-playbook", RoofingPlaybookTripwirePage);'
          if route_line not in text:
              text = text.replace(route_anchor, route_anchor + '\n' + route_line, 1)

          tree_anchor = 'hvacRoute, carpetCleaningRoute, roofingRoute, medSpaRoute, realEstateRoute,'
          tree_replacement = 'hvacRoute, carpetCleaningRoute, roofingRoute, roofingPlaybookTripwireRoute, medSpaRoute, realEstateRoute,'
          if tree_replacement not in text:
              if tree_anchor not in text:
                  raise SystemExit('route tree anchor not found')
              text = text.replace(tree_anchor, tree_replacement, 1)

          path.write_text(text)
          PY
          rm .github/workflows/embed-roofing-tripwire.yml
      - name: Commit embedded route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontend/src/App.tsx src/frontend/src/pages/RoofingPlaybookTripwirePage.tsx src/frontend/src/assets/roofing-ai-growth-playbook.html .github/workflows/embed-roofing-tripwire.yml
          git commit -m "fix: serve roofing tripwire through app router"
          git push origin main
