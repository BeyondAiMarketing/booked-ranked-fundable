name: Deploy Protected Nemo Container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/nemo-agent/**"
      - ".github/workflows/deploy-nemo-container.yml"

permissions:
  contents: read

concurrency:
  group: brf-nemo-container-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker and NeMo container
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install container gateway dependencies
        working-directory: services/nemo-agent
        run: npm install --no-audit --no-fund

      - name: Typecheck protected Worker ingress
        working-directory: services/nemo-agent
        run: npm run check

      - name: Create ephemeral Cloudflare secrets file
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NEMO_AGENT_SERVICE_TOKEN: ${{ secrets.NEMO_AGENT_SERVICE_TOKEN }}
        run: |
          node --input-type=module <<'EOF'
          import { writeFileSync } from "node:fs";
          const secrets = {
            NVIDIA_API_KEY: process.env.NVIDIA_API_KEY || "",
            NEMO_AGENT_SERVICE_TOKEN:
              process.env.NEMO_AGENT_SERVICE_TOKEN || "",
          };
          for (const [name, value] of Object.entries(secrets)) {
            if (!value) throw new Error(`Missing required GitHub secret: ${name}`);
          }
          if (secrets.NEMO_AGENT_SERVICE_TOKEN.length < 32) {
            throw new Error("NEMO_AGENT_SERVICE_TOKEN must be at least 32 characters.");
          }
          writeFileSync(
            `${process.env.RUNNER_TEMP}/brf-nemo-secrets.json`,
            JSON.stringify(secrets),
            { mode: 0o600 },
          );
          EOF

      - name: Deploy protected Worker and container
        working-directory: services/nemo-agent
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler deploy
          --secrets-file "$RUNNER_TEMP/brf-nemo-secrets.json"
          --containers-rollout=immediate

      - name: Remove ephemeral secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/brf-nemo-secrets.json"
