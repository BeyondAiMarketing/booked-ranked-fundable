name: Production Readiness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  roofing-playbook-audit-fix:
    name: Apply roofing playbook and audit fix
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/roofing-playbook-audit-delivery'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/roofing-playbook-audit-delivery
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply asserted source changes
        run: python .github/scripts/apply_roofing_playbook_audit_fix.py

      - name: Restore standard CI workflow
        run: git checkout origin/main -- .github/workflows/ci.yml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Format changed TypeScript files
        run: >-
          pnpm dlx prettier@3.6.2 --write
          src/frontend/src/components/RoofingPlaybookAuditOffer.tsx
          src/frontend/src/pages/HomePage.tsx
          src/frontend/src/pages/RoofingPage.tsx
          src/frontend/src/pages/RoofingPlaybookTripwirePage.tsx
          src/frontend/netlify/functions/capture-roofing-playbook-lead.mts
          src/frontend/netlify/functions/nemotron-audit.mts
          src/frontend/netlify/functions/send-roofing-audit-background.mts

      - name: Typecheck frontend
        run: pnpm --dir src/frontend typecheck

      - name: Run unit tests
        run: pnpm --dir src/frontend test

      - name: Build frontend
        run: pnpm --dir src/frontend build

      - name: Restore generated build artifacts
        run: git checkout origin/main -- src/frontend/dist || true

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix roofing playbook routes and email audits"
          git push origin HEAD:agent/roofing-playbook-audit-delivery

  frontend-quality:
    name: Frontend typecheck, tests, and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck frontend
        run: pnpm --dir src/frontend typecheck

      - name: Run unit tests
        run: pnpm --dir src/frontend test

      - name: Build frontend
        run: pnpm --dir src/frontend build

  browser-smoke-tests:
    name: Browser smoke tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Install Chromium
        run: pnpm --dir src/frontend exec playwright install chromium --with-deps

      - name: Build frontend
        run: pnpm --dir src/frontend build

      - name: Start preview server
        run: nohup pnpm --dir src/frontend exec vite preview --host 127.0.0.1 --port 4173 > /tmp/brf-vite.log 2>&1 &

      - name: Wait for preview server
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/brf-vite.log
          exit 1

      - name: Run Playwright smoke tests
        run: pnpm --dir src/frontend test:e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 7
