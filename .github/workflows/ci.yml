name: Production Readiness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend typecheck, tests, and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck frontend
        run: pnpm --dir src/frontend typecheck

      - name: Run unit tests
        run: pnpm --dir src/frontend test

      - name: Build frontend
        run: pnpm --dir src/frontend build

  browser-smoke-tests:
    name: Browser smoke tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Install Chromium
        run: pnpm --dir src/frontend exec playwright install chromium --with-deps

      - name: Build frontend
        run: pnpm --dir src/frontend build

      - name: Start preview server
        run: nohup pnpm --dir src/frontend exec vite preview --host 127.0.0.1 --port 4173 > /tmp/brf-vite.log 2>&1 &

      - name: Wait for preview server
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/brf-vite.log
          exit 1

      - name: Run Playwright smoke tests
        run: pnpm --dir src/frontend test:e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173

      - name: Diagnose Netlify main origin in Chromium
        id: netlify_main
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: https://main--booked-ranked-fundable.netlify.app
        run: pnpm --dir src/frontend exec playwright test e2e/public-routes.spec.ts --grep "live production"

      - name: Diagnose custom production domain in Chromium
        id: custom_domain
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: https://bookedrankedfunded.org
        run: pnpm --dir src/frontend exec playwright test e2e/public-routes.spec.ts --grep "live production"

      - name: Fail QA if either production target is wrong
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          echo "Netlify main origin: ${{ steps.netlify_main.outcome }}"
          echo "Custom production domain: ${{ steps.custom_domain.outcome }}"
          if [ "${{ steps.netlify_main.outcome }}" != "success" ] || [ "${{ steps.custom_domain.outcome }}" != "success" ]; then
            exit 1
          fi

      - name: Verify live roofing funnel after main deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: https://bookedrankedfunded.org
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            if pnpm --dir src/frontend exec playwright test e2e/public-routes.spec.ts --grep "live production"; then
              echo "Live homepage, roofing page, and roofing book funnel verified in Chromium."
              exit 0
            fi
            echo "Live roofing funnel not ready/correct yet (attempt ${attempt}/24); retrying in 10 seconds..."
            sleep 10
          done
          echo "Live roofing funnel never rendered the expected production content."
          exit 1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 7
